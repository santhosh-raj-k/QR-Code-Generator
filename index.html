<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <script src="script.js"></script>
      <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.js"></script>
</head>
<body class="font-['poppins'] m-0 p-4 box-border min-h-screen bg-[#667eea] flex justify-center items-center">
  <div class="text-center bg-white p-4 sm:p-8 rounded-xl w-full max-w-md">
    <h1 class="font-bold text-2xl sm:text-4xl mb-4">QR Code Generator</h1>
    <!-- Input Section -->
    <div id="input-section" class="flex flex-col sm:flex-row gap-4 items-center justify-center mb-5">
      <input type="text" id="qr-input" class=" w-full sm:w-auto sm:flex-1 border border-black p-4 rounded-xl focus:outline-none" placeholder="Enter Text or URL....">
      <button onclick="generate()" id="generate-btn" class="w-full sm:w-auto p-4 rounded-xl bg-[#667eea] text-white hover:bg-[#764ba2]">Generate QR Code</button>
    </div>
    <!-- QR Section -->
    <div id="qr-code" class="p-4 bg-white rounded-lg shadow-xl inline-block max-w-full"></div>
    <button onclick="download()" id="download-btn" class="hidden w-full mt-4 p-4 rounded-xl bg-[#667eea] text-white hover:bg-[#764ba2]">Download QR Code</button>
  </div>
</body>
</html>
